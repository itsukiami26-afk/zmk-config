name: Build Keychron B11 Pro Firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Cache ZMK modules
        uses: actions/cache@v4
        with:
          path: |
            .west
            modules
            zephyr
            bootloader
            zmk
          key: ${{ runner.os }}-zmk-b11-${{ hashFiles('**/west.yml') }}

      - name: Pull Official Keychron ZMK Engine
        run: |
          pip3 install west
          west init -m https://github.com --mr main
          west update
          west zephyr-export

      - name: Compile B11 Pro Layout
        run: |
          west build -s zmk/app -b keychron_b11_pro -- -DSHIELD=keychron_b11_pro

      - name: Archive Firmware Result
        uses: actions/upload-artifact@v4
        with:
          name: b11_pro_firmware
          path: build/zephyr/zmk.uf2
