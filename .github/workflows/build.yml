name: Build ZMK Firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 👈 Changed to v4 to stop the Node.js 24 crash

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            .west
            modules
            zephyr
            bootloader
            zmk
          key: ${{ runner.os }}-west-v4-${{ hashFiles('**/west.yml') }}

      - name: Initialize ZMK Workspace
        run: |
          pip3 install west
          west init -m https://github.com --mr main
          west update
          west zephyr-export

      - name: Build Firmware
        run: |
          west build -s zmk/app -b corne_v3_left

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: build/zephyr/zmk.uf2
